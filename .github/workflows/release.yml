# Push a tag (e.g. v1.0.1) -> build the addon zip and publish it to
# CurseForge (project 1825190, from ## X-Curse-Project-ID) and GitHub Releases.
# Interface 16001 is detected as WoW Forever by the packager.
# Tags containing "alpha" or "beta" publish as alpha/beta files.
name: Package and release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
